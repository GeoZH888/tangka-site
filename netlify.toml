# Netlify configuration for the tangka site (deploys to feiyitangka.netlify.app)
# Proxied at david-zhongwen.net/feiyi/tangka-exhibition/* via clf-platform's netlify.toml.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_EXHIBITION_SLUG,VITE_BASE_PATH,VITE_SITE_BASE_URL,VITE_STUDIO_PASSWORD"

# Asset rewrites — Vite emits HTML with /feiyi/tangka-exhibition/assets/... URLs
# but actual files live at /assets/... — rewrite to map them
[[redirects]]
  from = "/feiyi/tangka-exhibition/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/feiyi/tangka-exhibition/favicon.ico"
  to = "/favicon.ico"
  status = 200

# API → functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — HTML routes serve index.html for React Router
[[redirects]]
  from = "/feiyi/tangka-exhibition/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
