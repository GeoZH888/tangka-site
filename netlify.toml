# Netlify configuration for the tangka site (deploys to tangka.netlify.app)
# The custom-domain proxy lives in the david-zhongwen.net repo's netlify.toml.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  [build.environment]
     NODE_VERSION = "20"
     SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_EXHIBITION_SLUG,VITE_BASE_PATH,VITE_SITE_BASE_URL,VITE_STUDIO_PASSWORD"

# SPA fallback — every unknown route serves index.html so React Router can handle it
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

  # In netlify.toml of the david-zhongwen.net repo
[[redirects]]
  from = "/feiyi/tangka/*"
  to = "https://feiyitangka.netlify.app/feiyi/tangka/:splat"
  status = 200
  force = true

  

[functions]
  node_bundler = "esbuild"

# Cache static assets aggressively (Vite hashes filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
